server {
  listen 80;
  listen [::]:80;
  server_name git.infintraining.work;

  location ^~ /.well-known/acme-challenge/ {
    root /var/www/letsencrypt;
    default_type "text/plain";
    try_files $uri =404;
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

server {
  listen 443 ssl;
  listen [::]:443 ssl;
  server_name git.infintraining.work;

  client_max_body_size 512m;

  # Temporary platform certificate. Replace with a git.infintraining.work
  # certificate once the domain can pass DNS-01/ICP validation.
  ssl_certificate /etc/letsencrypt/live/infintraining.work/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/infintraining.work/privkey.pem;
  include /etc/letsencrypt/options-ssl-nginx.conf;
  ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

  location / {
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_pass http://127.0.0.1:3001;
  }
}

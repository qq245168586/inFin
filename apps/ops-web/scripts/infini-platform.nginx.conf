server {
  listen 443 ssl;
  listen [::]:443 ssl;
  server_name api.infintraining.work;

  ssl_certificate /etc/nginx/ssl/api-rsa/fullchain.cer;
  ssl_certificate_key /etc/nginx/ssl/api-rsa/privkey.key;
  include /etc/letsencrypt/options-ssl-nginx.conf;
  ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

  client_max_body_size 512m;

  location ^~ /ops/ {
    alias /var/www/infini-ops/;
    try_files $uri $uri/ /ops/index.html;
    add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
    expires -1;
  }

  location /mqtt {
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_pass http://127.0.0.1:8083/mqtt;
  }

  location ^~ /api/tv/ {
    proxy_http_version 1.1;
    include /etc/nginx/snippets/infini-tv-api-proxy.conf;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_pass http://127.0.0.1:3100/api/tv/;
  }

  location /api/ {
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_pass http://127.0.0.1:3100/api/;
  }

  location /media/ {
    alias /srv/infini/media/;
    expires 30d;
    add_header Cache-Control "public, max-age=2592000";
  }

  location / {
    return 404;
  }
}


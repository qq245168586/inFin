server {
  listen 80 default_server;
  listen [::]:80 default_server;
  server_name infintraining.work www.infintraining.work admin.infintraining.work coach.infintraining.work course.infintraining.work api.infintraining.work ops.infintraining.work download.infintraining.work;

  client_max_body_size 512m;

  location ^~ /.well-known/acme-challenge/ {
    root /var/www/letsencrypt;
    default_type "text/plain";
    try_files $uri =404;
  }

  location /api/ {
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_pass http://127.0.0.1:3100/api/;
  }

  location /mqtt {
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_pass http://127.0.0.1:8083/mqtt;
  }

  location /media/ {
    alias /srv/infini/media/;
    expires 30d;
    add_header Cache-Control "public, max-age=2592000";
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

server {
  listen 443 ssl;
  listen [::]:443 ssl;
  server_name infintraining.work www.infintraining.work admin.infintraining.work;

  root /var/www/infini-admin;
  index index.html;
  client_max_body_size 512m;
  add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
  expires -1;

  ssl_certificate /etc/nginx/ssl/infini-web-rsa/fullchain.cer;
  ssl_certificate_key /etc/nginx/ssl/infini-web-rsa/privkey.key;
  include /etc/letsencrypt/options-ssl-nginx.conf;
  ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

  location / {
    try_files $uri $uri/ /index.html;
  }

  location /api/ {
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_pass http://127.0.0.1:3100/api/;
  }

  location /mqtt {
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_pass http://127.0.0.1:8083/mqtt;
  }

  location /media/ {
    alias /srv/infini/media/;
    expires 30d;
    add_header Cache-Control "public, max-age=2592000";
  }
}


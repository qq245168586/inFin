# Include inside Nginx locations that proxy high-frequency TV runtime APIs.
# TV boxes in the same venue often share one public IP, so these endpoints need
# a wider burst envelope than admin/course/coach management APIs.
proxy_connect_timeout 5s;
proxy_send_timeout 60s;
proxy_read_timeout 60s;
send_timeout 30s;
proxy_buffering on;
proxy_buffer_size 32k;
proxy_buffers 16 16k;
proxy_busy_buffers_size 64k;
proxy_max_temp_file_size 128m;
limit_req zone=infini_api burst=300 nodelay;
limit_conn infini_perip 80;

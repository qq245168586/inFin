# Copy to /etc/nginx/conf.d/infini-performance.conf.
# This file is loaded in nginx http{} context.
map $http_upgrade $connection_upgrade {
  default upgrade;
  '' close;
}

limit_req_zone $binary_remote_addr zone=infini_api:10m rate=10r/s;
limit_conn_zone $binary_remote_addr zone=infini_perip:10m;

gzip_vary on;
gzip_proxied any;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_buffers 16 8k;
gzip_http_version 1.1;
gzip_types text/plain text/css text/javascript application/javascript application/json application/xml application/xml+rss image/svg+xml;

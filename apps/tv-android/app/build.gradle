plugins {
  id "com.android.application"
  id "jacoco"
}

android {
  namespace "com.infini.tv"
  compileSdk 34

  buildFeatures {
    buildConfig true
  }

  def infiniEnv = (project.findProperty("infiniEnv") ?: "production").toString()
  def infiniBaseUrl = (project.findProperty("infiniBaseUrl") ?: "https://api.infintraining.work").toString()
  def infiniBackupBaseUrl = (project.findProperty("infiniBackupBaseUrl") ?: "http://8.130.65.113").toString()
  def infiniMqttPrimaryUrl = (project.findProperty("infiniMqttPrimaryUrl") ?: "wss://api.infintraining.work/mqtt").toString()
  def infiniMqttBackupUrl = (project.findProperty("infiniMqttBackupUrl") ?: "tcp://8.130.65.113:1883").toString()

  defaultConfig {
    applicationId "com.infini.tv"
    minSdk 26
    targetSdk 34
        versionCode 63
        versionName "1.0.63"
    buildConfigField "String", "INFINI_ENV", "\"${infiniEnv}\""
    buildConfigField "String", "INFINI_BASE_URL", "\"${infiniBaseUrl}\""
    buildConfigField "String", "INFINI_BACKUP_BASE_URL", "\"${infiniBackupBaseUrl}\""
    buildConfigField "String", "INFINI_MQTT_PRIMARY_URL", "\"${infiniMqttPrimaryUrl}\""
    buildConfigField "String", "INFINI_MQTT_BACKUP_URL", "\"${infiniMqttBackupUrl}\""
  }

  buildTypes {
    release {
      minifyEnabled false
      signingConfig signingConfigs.debug
    }
  }

  testOptions {
    unitTests {
      returnDefaultValues true
    }
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }
}

jacoco {
  toolVersion = "0.8.12"
}

dependencies {
  implementation "androidx.appcompat:appcompat:1.7.0"
  implementation "com.google.android.material:material:1.12.0"
  implementation "com.google.zxing:core:3.5.3"
  implementation "com.squareup.okhttp3:okhttp:4.12.0"
  implementation "org.eclipse.paho:org.eclipse.paho.client.mqttv3:1.2.5"

  testImplementation "junit:junit:4.13.2"
}

tasks.withType(Test).configureEach {
  testLogging {
    events "failed", "skipped"
    exceptionFormat "full"
  }
}

tasks.register("jacocoDebugUnitTestReport", JacocoReport) {
  dependsOn "testDebugUnitTest"

  reports {
    xml.required = true
    html.required = true
  }

  def excludes = [
      '**/R.class',
      '**/R$*.class',
      '**/BuildConfig.*',
      '**/Manifest*.*',
      '**/*Test*.*'
  ]

  classDirectories.setFrom(files([
      fileTree(dir: "${buildDir}/intermediates/javac/debug/compileDebugJavaWithJavac/classes", excludes: excludes),
      fileTree(dir: "${buildDir}/intermediates/javac/debug/classes", excludes: excludes)
  ]))
  sourceDirectories.setFrom(files("src/main/java"))
  executionData.setFrom(fileTree(dir: buildDir, includes: [
      "jacoco/testDebugUnitTest.exec",
      "outputs/unit_test_code_coverage/debugUnitTest/testDebugUnitTest.exec"
  ]))
}

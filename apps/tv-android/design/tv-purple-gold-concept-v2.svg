<svg width="1800" height="1180" viewBox="0 0 1800 1180" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1800" y2="1180" gradientUnits="userSpaceOnUse">
      <stop stop-color="#090A12"/>
      <stop offset=".48" stop-color="#151020"/>
      <stop offset="1" stop-color="#050508"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#31055E"/>
      <stop offset=".58" stop-color="#19002C"/>
      <stop offset="1" stop-color="#090011"/>
    </linearGradient>
    <linearGradient id="panelSoft" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#27143D"/>
      <stop offset="1" stop-color="#0D0B14"/>
    </linearGradient>
    <linearGradient id="violet" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#8D22FF"/>
      <stop offset="1" stop-color="#C61DFF"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#FFE8A5"/>
      <stop offset=".42" stop-color="#D8A84A"/>
      <stop offset="1" stop-color="#8A5714"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#12B9F2"/>
      <stop offset="1" stop-color="#0758C8"/>
    </linearGradient>
    <linearGradient id="red" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#FF4B39"/>
      <stop offset="1" stop-color="#B91521"/>
    </linearGradient>
    <filter id="glowPurple" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="18" result="b"/>
      <feColorMatrix in="b" type="matrix" values="0.65 0 0 0 0.45 0 0.08 0 0 0.02 0 0 0.9 0 1 0 0 0 .42 0"/>
      <feBlend in="SourceGraphic"/>
    </filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="20" stdDeviation="24" flood-color="#000000" flood-opacity=".45"/>
    </filter>
    <style>
      .font { font-family: "PingFang SC","Noto Sans CJK SC",Arial,sans-serif; }
      .title { font-family: "PingFang SC","Noto Sans CJK SC",Arial,sans-serif; font-weight: 900; fill: #F8F3E7; }
      .caption { font-family: "PingFang SC","Noto Sans CJK SC",Arial,sans-serif; font-weight: 800; fill: #B6AEE2; letter-spacing: 5px; }
      .muted { font-family: "PingFang SC","Noto Sans CJK SC",Arial,sans-serif; fill: #AAA1C8; }
      .tv { font-family: "Arial Black","PingFang SC",Arial,sans-serif; font-weight: 900; fill: #FFFDF7; }
      .goldText { font-family: "Arial Black","PingFang SC",Arial,sans-serif; font-weight: 900; fill: url(#gold); }
    </style>
  </defs>

  <rect width="1800" height="1180" fill="url(#bg)"/>
  <circle cx="1600" cy="116" r="160" fill="#22123B" opacity=".55"/>
  <circle cx="180" cy="1050" r="210" fill="#170F28" opacity=".7"/>
  <path d="M86 245 C360 84 650 142 880 250 C1130 367 1350 275 1668 96" stroke="#332150" stroke-width="2" opacity=".6"/>

  <text x="70" y="72" class="caption" font-size="22">INFINI TV DESIGN V2</text>
  <text x="70" y="128" class="title" font-size="52">紫黑金 TV 视觉系统</text>
  <text x="70" y="170" class="muted" font-size="22">去掉白底，增加过渡页，重新调整电视安全边距与远距离可读性。</text>

  <!-- Portrait workout -->
  <g transform="translate(72 235)" filter="url(#shadow)">
    <text x="0" y="-30" class="title" font-size="30">竖屏训练页 · 站点视频</text>
    <rect x="0" y="0" width="408" height="720" rx="26" fill="#07070C" stroke="#3A1D62" stroke-width="3"/>
    <rect x="18" y="18" width="372" height="116" rx="12" fill="#10001D"/>
    <rect x="18" y="18" width="132" height="116" rx="10" fill="url(#blue)"/>
    <circle cx="84" cy="76" r="45" stroke="#F9FAFF" stroke-width="8" opacity=".92"/>
    <path d="M84 31 A45 45 0 0 1 126 60" stroke="#7FE9FF" stroke-width="8" stroke-linecap="round"/>
    <text x="84" y="96" class="tv" font-size="64" text-anchor="middle">38</text>
    <rect x="164" y="18" width="226" height="116" rx="10" fill="url(#panel)"/>
    <text x="190" y="68" class="tv" font-size="36">WORK</text>
    <text x="192" y="106" class="muted" font-size="21" font-weight="800">SET 1</text>
    <circle cx="326" cy="95" r="7" fill="url(#gold)"/>
    <circle cx="350" cy="95" r="7" stroke="#B8872F" stroke-width="3"/>
    <circle cx="374" cy="95" r="7" stroke="#B8872F" stroke-width="3"/>

    <g transform="translate(18 154)">
      <g>
        <rect x="0" y="0" width="372" height="152" rx="10" fill="#08080D"/>
        <rect x="0" y="0" width="68" height="152" rx="10" fill="url(#violet)"/>
        <rect x="68" y="0" width="4" height="152" fill="#050508"/>
        <text x="34" y="92" class="tv" font-size="54" text-anchor="middle">1</text>
        <rect x="82" y="12" width="278" height="128" rx="8" fill="#141018"/>
        <rect x="118" y="12" width="206" height="128" fill="#21182B"/>
        <circle cx="220" cy="76" r="36" fill="#FFFFFF" opacity=".08"/>
        <path d="M210 54 L250 76 L210 98 Z" fill="url(#gold)"/>
      </g>
      <g transform="translate(0 170)" opacity=".42">
        <rect x="0" y="0" width="372" height="152" rx="10" fill="#08080D"/>
        <rect x="0" y="0" width="68" height="152" rx="10" fill="#7E1ADD"/>
        <rect x="68" y="0" width="4" height="152" fill="#050508"/>
        <text x="34" y="92" class="tv" font-size="54" text-anchor="middle">2</text>
        <rect x="82" y="12" width="278" height="128" rx="8" fill="#141018"/>
        <rect x="118" y="12" width="206" height="128" fill="#21182B"/>
        <path d="M210 54 L250 76 L210 98 Z" fill="#BBA06B"/>
      </g>
      <g transform="translate(0 340)" opacity=".42">
        <rect x="0" y="0" width="372" height="152" rx="10" fill="#08080D"/>
        <rect x="0" y="0" width="68" height="152" rx="10" fill="#7E1ADD"/>
        <rect x="68" y="0" width="4" height="152" fill="#050508"/>
        <text x="34" y="92" class="tv" font-size="54" text-anchor="middle">3</text>
        <rect x="82" y="12" width="278" height="128" rx="8" fill="#141018"/>
        <rect x="118" y="12" width="206" height="128" fill="#21182B"/>
        <path d="M210 54 L250 76 L210 98 Z" fill="#BBA06B"/>
      </g>
    </g>
    <rect x="18" y="686" width="372" height="8" rx="4" fill="#1D0A32"/>
  </g>

  <!-- Landscape progress -->
  <g transform="translate(540 235)" filter="url(#shadow)">
    <text x="0" y="-30" class="title" font-size="30">横屏进度页 · 课程总节奏</text>
    <rect x="0" y="0" width="760" height="428" rx="24" fill="#07070C" stroke="#3A1D62" stroke-width="3"/>
    <rect x="18" y="18" width="724" height="392" rx="18" fill="url(#panel)"/>
    <g transform="translate(88 70)" filter="url(#glowPurple)">
      <circle cx="170" cy="142" r="126" stroke="#3B1473" stroke-width="26"/>
      <path d="M170 16 A126 126 0 1 1 54 192" stroke="#F04835" stroke-width="26"/>
      <circle cx="54" cy="192" r="22" fill="#FFFDF7"/>
      <text x="170" y="179" class="tv" font-size="106" text-anchor="middle">38</text>
    </g>
    <g transform="translate(430 90)">
      <circle cx="36" cy="47" r="27" fill="url(#gold)"/>
      <path d="M18 47 H31 L39 33 L50 63 L60 47 H75" stroke="#11071E" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="90" y="67" class="tv" font-size="58">WORK</text>
      <text x="2" y="130" class="muted" font-size="24" font-weight="800">SET 1</text>
      <text x="2" y="166" class="muted" font-size="18">正式训练进度</text>
    </g>
    <g transform="translate(52 340)">
      <rect x="0" y="0" width="160" height="14" rx="7" fill="#F7F3E6"/>
      <path d="M224 13 C224 -3 244 -38 244 -38 C244 -38 264 -3 264 13 C264 31 250 42 244 42 C238 42 224 31 224 13Z" fill="url(#gold)"/>
      <rect x="300" y="0" width="160" height="14" rx="7" fill="#5B39A8"/>
      <rect x="300" y="0" width="80" height="14" rx="7" fill="#F7F3E6"/>
      <path d="M524 13 C524 -3 544 -38 544 -38 C544 -38 564 -3 564 13 C564 31 550 42 544 42 C538 42 524 31 524 13Z" fill="#6D43C3"/>
      <rect x="600" y="0" width="92" height="14" rx="7" fill="#5B39A8"/>
    </g>
  </g>

  <!-- Transition pages -->
  <g transform="translate(1360 235)">
    <text x="0" y="-30" class="title" font-size="30">过渡页 · 远距离提示</text>
    <g transform="translate(0 0)" filter="url(#shadow)">
      <rect width="360" height="190" rx="22" fill="#09090E" stroke="#3A1D62" stroke-width="3"/>
      <rect x="18" y="18" width="324" height="154" rx="16" fill="url(#panel)"/>
      <circle cx="94" cy="95" r="58" stroke="#F8F3E7" stroke-width="9" opacity=".9"/>
      <path d="M94 37 A58 58 0 0 1 145 68" stroke="#FF4938" stroke-width="10"/>
      <text x="94" y="116" class="tv" font-size="62" text-anchor="middle">15</text>
      <text x="180" y="82" class="tv" font-size="32">GET READY</text>
      <text x="180" y="122" class="goldText" font-size="28">WARM UP</text>
    </g>
    <g transform="translate(0 214)" filter="url(#shadow)">
      <rect width="360" height="190" rx="22" fill="#09090E" stroke="#3A1D62" stroke-width="3"/>
      <rect x="18" y="18" width="324" height="154" rx="16" fill="#C9322B"/>
      <circle cx="94" cy="95" r="58" stroke="#FFFDF7" stroke-width="9" opacity=".9"/>
      <text x="94" y="116" class="tv" font-size="62" text-anchor="middle">28</text>
      <text x="178" y="86" class="tv" font-size="48">REST</text>
      <g transform="translate(180 120)">
        <circle cx="0" cy="0" r="8" fill="#FFFDF7"/>
        <circle cx="28" cy="0" r="8" stroke="#FFFDF7" stroke-width="4"/>
        <circle cx="56" cy="0" r="8" stroke="#FFFDF7" stroke-width="4"/>
      </g>
    </g>
    <g transform="translate(0 428)" filter="url(#shadow)">
      <rect width="360" height="190" rx="22" fill="#09090E" stroke="#3A1D62" stroke-width="3"/>
      <rect x="18" y="18" width="324" height="154" rx="16" fill="#0BBE6A"/>
      <circle cx="94" cy="95" r="58" stroke="#FFFDF7" stroke-width="9" opacity=".9"/>
      <text x="94" y="116" class="tv" font-size="62" text-anchor="middle">12</text>
      <text x="178" y="80" class="tv" font-size="34">MOVE</text>
      <text x="178" y="122" class="tv" font-size="34">STATION</text>
    </g>
  </g>

  <!-- Full-screen move zone / hydrate concepts -->
  <g transform="translate(72 1000)">
    <rect x="0" y="-94" width="760" height="118" rx="24" fill="#0A0A10" stroke="#342052"/>
    <text x="28" y="-48" class="title" font-size="26">过渡规则</text>
    <text x="28" y="-16" class="muted" font-size="19">前半段全屏状态页，后半段回训练画面顶部显示状态；横屏保持进度页不切全屏。</text>
  </g>
</svg>

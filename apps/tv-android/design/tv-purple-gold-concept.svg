<svg width="1600" height="900" viewBox="0 0 1600 900" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="boardBg" x1="0" y1="0" x2="1600" y2="900" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0D0E18"/>
      <stop offset=".52" stop-color="#181224"/>
      <stop offset="1" stop-color="#090910"/>
    </linearGradient>
    <linearGradient id="purplePanel" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#2B064B"/>
      <stop offset="1" stop-color="#12001F"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#FFE7A3"/>
      <stop offset=".45" stop-color="#D6A84A"/>
      <stop offset="1" stop-color="#8B5A12"/>
    </linearGradient>
    <linearGradient id="violet" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#8B22FF"/>
      <stop offset="1" stop-color="#C020FF"/>
    </linearGradient>
    <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feColorMatrix in="blur" type="matrix" values="0.65 0 0 0 0.52 0 0.15 0 0 0.05 0 0 0.9 0 1 0 0 0 0.65 0"/>
      <feBlend in="SourceGraphic"/>
    </filter>
    <filter id="goldGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feColorMatrix in="blur" type="matrix" values="1 0 0 0 0.75 0 0.65 0 0 0.42 0 0 0.18 0 0.04 0 0 0 0.8 0"/>
      <feBlend in="SourceGraphic"/>
    </filter>
    <style>
      .title { font-family: "PingFang SC", "Noto Sans CJK SC", Arial, sans-serif; font-weight: 900; fill: #F8F3E7; }
      .label { font-family: "PingFang SC", "Noto Sans CJK SC", Arial, sans-serif; font-weight: 800; fill: #B7AEE2; letter-spacing: 6px; }
      .small { font-family: "PingFang SC", "Noto Sans CJK SC", Arial, sans-serif; fill: #BEB7D5; }
      .tvText { font-family: "Arial Black", "PingFang SC", sans-serif; font-weight: 900; fill: #FFFFFF; }
      .goldText { font-family: "Arial Black", "PingFang SC", sans-serif; font-weight: 900; fill: url(#gold); }
    </style>
  </defs>

  <rect width="1600" height="900" fill="url(#boardBg)"/>
  <circle cx="1490" cy="92" r="122" fill="#2A173B" opacity=".46"/>
  <circle cx="128" cy="792" r="170" fill="#1B1230" opacity=".8"/>
  <path d="M70 760 C290 470 520 390 760 450 C980 505 1090 450 1260 270 C1358 165 1435 120 1530 104" stroke="#30134F" stroke-width="2" opacity=".55"/>

  <text x="72" y="72" class="label" font-size="22">INFINI TV DESIGN</text>
  <text x="72" y="126" class="title" font-size="48">紫黑金 TV 视觉方向</text>
  <text x="72" y="166" class="small" font-size="22">适配电视远距离观看：更大的倒计时、更少文字、更强状态色。</text>

  <!-- Portrait screen card -->
  <g transform="translate(98 220)">
    <text x="0" y="-32" class="title" font-size="30">竖屏训练页</text>
    <rect x="0" y="0" width="430" height="620" rx="30" fill="#08080E" stroke="#38205E" stroke-width="3"/>
    <rect x="16" y="16" width="398" height="112" rx="10" fill="#140022"/>
    <rect x="16" y="16" width="142" height="112" rx="8" fill="#0DA9E5"/>
    <circle cx="87" cy="72" r="44" stroke="#F7F7FF" stroke-width="7" opacity=".94"/>
    <path d="M87 28 A44 44 0 0 1 126 52" stroke="#2DDAFF" stroke-width="8" stroke-linecap="round"/>
    <text x="88" y="90" class="tvText" font-size="58" text-anchor="middle">38</text>
    <rect x="170" y="16" width="244" height="112" rx="8" fill="url(#purplePanel)"/>
    <text x="198" y="62" class="tvText" font-size="28">WORK</text>
    <text x="198" y="99" class="small" font-size="20" font-weight="700">SET 1</text>
    <circle cx="360" cy="84" r="7" fill="url(#gold)"/>
    <circle cx="382" cy="84" r="7" stroke="#D6A84A" stroke-width="3"/>
    <circle cx="404" cy="84" r="7" stroke="#D6A84A" stroke-width="3"/>

    <g transform="translate(16 145)">
      <g>
        <rect x="0" y="0" width="398" height="132" rx="8" fill="#FBFAF2"/>
        <rect x="0" y="0" width="70" height="132" rx="8" fill="url(#violet)"/>
        <path d="M70 0 H78 V132 H70 Z" fill="#180323"/>
        <text x="35" y="82" class="tvText" font-size="52" text-anchor="middle">1</text>
        <rect x="96" y="14" width="276" height="104" rx="5" fill="#F7F5EE"/>
        <circle cx="228" cy="64" r="34" fill="#252033" opacity=".18"/>
        <path d="M218 44 L256 64 L218 84 Z" fill="#B08A2E" opacity=".75"/>
      </g>
      <g transform="translate(0 148)" opacity=".48">
        <rect x="0" y="0" width="398" height="132" rx="8" fill="#FBFAF2"/>
        <rect x="0" y="0" width="70" height="132" rx="8" fill="#7D19D9"/>
        <path d="M70 0 H78 V132 H70 Z" fill="#180323"/>
        <text x="35" y="82" class="tvText" font-size="52" text-anchor="middle">2</text>
        <rect x="96" y="14" width="276" height="104" rx="5" fill="#F7F5EE"/>
        <circle cx="228" cy="64" r="34" fill="#252033" opacity=".18"/>
        <path d="M218 44 L256 64 L218 84 Z" fill="#8E7A51" opacity=".55"/>
      </g>
      <g transform="translate(0 296)" opacity=".48">
        <rect x="0" y="0" width="398" height="132" rx="8" fill="#FBFAF2"/>
        <rect x="0" y="0" width="70" height="132" rx="8" fill="#7D19D9"/>
        <path d="M70 0 H78 V132 H70 Z" fill="#180323"/>
        <text x="35" y="82" class="tvText" font-size="52" text-anchor="middle">3</text>
        <rect x="96" y="14" width="276" height="104" rx="5" fill="#F7F5EE"/>
        <circle cx="228" cy="64" r="34" fill="#252033" opacity=".18"/>
        <path d="M218 44 L256 64 L218 84 Z" fill="#8E7A51" opacity=".55"/>
      </g>
    </g>
    <text x="215" y="590" class="goldText" font-size="20" text-anchor="middle">HIGH CONTRAST · SAFE MARGIN</text>
  </g>

  <!-- Landscape screen card -->
  <g transform="translate(600 220)">
    <text x="0" y="-32" class="title" font-size="30">横屏进度页</text>
    <rect x="0" y="0" width="900" height="506" rx="30" fill="#090810" stroke="#38205E" stroke-width="3"/>
    <rect x="18" y="18" width="864" height="470" rx="20" fill="#24004B"/>
    <rect x="18" y="18" width="864" height="470" rx="20" fill="url(#purplePanel)" opacity=".75"/>

    <g transform="translate(86 76)" filter="url(#softGlow)">
      <circle cx="250" cy="170" r="152" stroke="#3B1473" stroke-width="30"/>
      <path d="M250 18 A152 152 0 1 1 111 231" stroke="#F04835" stroke-width="30" stroke-linecap="butt"/>
      <circle cx="110" cy="232" r="25" fill="#FFFFFF"/>
      <text x="250" y="205" class="tvText" font-size="112" text-anchor="middle">38</text>
      <text x="250" y="266" class="small" font-size="24" text-anchor="middle">SECONDS</text>
    </g>

    <g transform="translate(548 108)">
      <text x="0" y="0" class="small" font-size="25" font-weight="800">当前状态</text>
      <circle cx="42" cy="78" r="30" fill="url(#gold)" filter="url(#goldGlow)"/>
      <path d="M24 78 H37 L45 63 L56 94 L66 78 H82" stroke="#140B20" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="96" y="98" class="tvText" font-size="64">WORK</text>
      <text x="2" y="160" class="small" font-size="28">SET 1</text>
      <circle cx="12" cy="204" r="10" fill="url(#gold)"/>
      <circle cx="48" cy="204" r="10" stroke="#D6A84A" stroke-width="4"/>
      <circle cx="84" cy="204" r="10" stroke="#D6A84A" stroke-width="4"/>
    </g>

    <g transform="translate(68 404)">
      <rect x="0" y="0" width="238" height="16" rx="8" fill="#5130A0"/>
      <rect x="0" y="0" width="188" height="16" rx="8" fill="#FFFFFF"/>
      <path d="M332 16 C332 -2 354 -40 354 -40 C354 -40 376 -2 376 16 C376 36 360 48 354 48 C348 48 332 36 332 16Z" fill="url(#gold)"/>
      <rect x="430" y="0" width="238" height="16" rx="8" fill="#5130A0"/>
      <rect x="430" y="0" width="96" height="16" rx="8" fill="#FFFFFF"/>
      <path d="M762 16 C762 -2 784 -40 784 -40 C784 -40 806 -2 806 16 C806 36 790 48 784 48 C778 48 762 36 762 16Z" fill="#6D43C3"/>
    </g>
  </g>

  <g transform="translate(72 810)">
    <rect x="0" y="0" width="1456" height="1" fill="#35234D"/>
    <text x="0" y="46" class="small" font-size="20">建议：竖屏训练页只保留倒计时、状态、站点序号与视频；横屏负责全局节奏、补水/换区节点和课程进度。</text>
  </g>
</svg>

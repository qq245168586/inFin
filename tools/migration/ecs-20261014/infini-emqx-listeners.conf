## Public MQTT terminates at Nginx WSS/443. EMQX accepts only the local
## WebSocket upstream and never exposes TCP/1883 or its own TLS listeners.
listeners.tcp.default {
  bind = 0
  enabled = false
}

listeners.ssl.default {
  bind = 0
  enabled = false
}

listeners.ws.default {
  bind = "127.0.0.1:8083"
  enabled = true
  enable_authn = true

  websocket {
    mqtt_path = "/mqtt"
  }
}

listeners.wss.default {
  bind = 0
  enabled = false
}

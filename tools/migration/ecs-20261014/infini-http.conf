map $http_upgrade $infini_connection_upgrade {
  default upgrade;
  '' close;
}

limit_req_zone $binary_remote_addr zone=infini_api:10m rate=10r/s;
limit_conn_zone $binary_remote_addr zone=infini_perip:10m;

map "$http_x_infini_media_intent:$http_x_infini_device_id:$http_x_infini_screen_number" $infini_tv_media_resource_key {
  default "";
  ~^cache:([^:]+):([1-5])$ "$1:$2:$uri";
}

map $status $infini_media_retry_after {
  default "";
  429 5;
}

limit_conn_zone $infini_tv_media_resource_key zone=infini_tv_media_resource:10m;

log_format infini_media escape=json
  '{"time":"$time_iso8601","request_id":"$request_id",'
  '"device_id":"$http_x_infini_device_id","screen":"$http_x_infini_screen_number",'
  '"checksum":"$http_x_infini_media_checksum","app_version":"$http_x_infini_app_version",'
  '"method":"$request_method","uri":"$request_uri","range":"$http_range",'
  '"status":$status,"bytes":$body_bytes_sent,"request_time":$request_time}';

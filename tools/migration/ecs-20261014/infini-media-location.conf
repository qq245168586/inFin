location ^~ /_infini_media/ {
  internal;
  alias /var/lib/infini/media/;

  sendfile on;
  tcp_nopush on;
  open_file_cache max=1000 inactive=60s;
  open_file_cache_valid 60s;
  open_file_cache_min_uses 2;
  open_file_cache_errors on;

  limit_conn infini_tv_media_resource 1;
  limit_conn_status 429;
  add_header Retry-After $infini_media_retry_after always;
  access_log /var/log/nginx/infini-media-access.log infini_media;
}

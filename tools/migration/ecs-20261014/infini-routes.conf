# Include this file inside the existing 114.215.185.184 TLS server block.
# TMY keeps its existing root, /api, /git, /h5 and update routes.

location = /infini {
  return 302 /infini/admin/;
}

location = /infini/ {
  return 302 /infini/admin/;
}

location ^~ /infini/admin/ {
  root /var/www;
  try_files $uri $uri/ /infini/admin/index.html;
  add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
  expires -1;
}

location ^~ /infini/course/simulator/ {
  root /var/www;
  try_files $uri $uri/ /infini/course/simulator/index.html;
  add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
  expires -1;
}

location ^~ /infini/course/ {
  root /var/www;
  try_files $uri $uri/ /infini/course/index.html;
  add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
  expires -1;
}

location ^~ /infini/coach/ {
  root /var/www;
  try_files $uri $uri/ /infini/coach/index.html;
  add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
  expires -1;
}

location ^~ /infini/ops/ {
  root /var/www;
  try_files $uri $uri/ /infini/ops/index.html;
  add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
  expires -1;
}

location ^~ /infini/download/ {
  root /var/www;
  try_files $uri $uri/ /infini/download/index.html;
  add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
  expires -1;
}

location = /infini/api/ops/mqtt/stream {
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_buffering off;
  proxy_read_timeout 3600s;
  proxy_pass http://127.0.0.1:3100/api/ops/mqtt/stream;
}

location ^~ /infini/api/ {
  client_max_body_size 512m;
  proxy_http_version 1.1;
  include /etc/nginx/snippets/infini-api-proxy.conf;
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_pass http://127.0.0.1:3100/api/;
}

location = /infini/mqtt {
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection $infini_connection_upgrade;
  proxy_read_timeout 3600s;
  proxy_send_timeout 3600s;
  proxy_pass http://127.0.0.1:8083/mqtt;
}

# Fixed public bucket only: never forward application credentials to OSS.
location ^~ /infini/simulator-media/oss-shanghai/ {
  limit_except GET { deny all; }
  proxy_set_header Host console-background.oss-cn-shanghai.aliyuncs.com;
  proxy_set_header Authorization "";
  proxy_set_header Cookie "";
  proxy_ssl_server_name on;
  proxy_ssl_name console-background.oss-cn-shanghai.aliyuncs.com;
  proxy_ssl_verify on;
  proxy_ssl_trusted_certificate /etc/pki/tls/certs/ca-bundle.crt;
  proxy_connect_timeout 10s;
  proxy_read_timeout 60s;
  proxy_max_temp_file_size 0;
  expires 1d;
  proxy_pass https://console-background.oss-cn-shanghai.aliyuncs.com/;
}

# Existing open tabs retain the old path until refreshed.
location ^~ /simulator-media/oss-shanghai/ {
  return 307 /infini$request_uri;
}

location ^~ /infini/media/ {
  alias /var/lib/infini/media/;
  expires 30d;
  add_header Cache-Control "public, max-age=2592000";
}

include /etc/nginx/snippets/infini-media-location.conf;

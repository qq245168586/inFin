worker_processes 1;
pid /var/tmp/infini-staging-nginx.pid;
error_log /var/tmp/infini-staging-nginx-error.log;
events { worker_connections 256; }
http {
  include /etc/nginx/mime.types;
  types_hash_max_size 2048;
  access_log /var/tmp/infini-staging-nginx-access.log;
  include /etc/nginx/conf.d/infini-http.conf;
  server {
    listen 127.0.0.1:3443 ssl;
    server_name 114.215.185.184;
    ssl_certificate /etc/letsencrypt/live/tmy-phase2-ip/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tmy-phase2-ip/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 512m;
    include /etc/nginx/snippets/infini-routes.conf;
  }
}
